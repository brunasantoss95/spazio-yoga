<html lang="pt-BR">

    <meta charset="UTF-8" />

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Spazio Yoga</title>
    <link rel="shortcut icon" href="src/img/logo.png" type="image/x-icon" />

    <!-- fontes-->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> -->
    <!-- <link
      href="https://fonts.googleapis.com/css2?family=Gabriela&display=swap"
      rel="stylesheet"
    /> -->

    <link rel="stylesheet" href="./src/css/about.css" />
    <link rel="stylesheet" href="./src/css/admin.css" />
    <link rel="stylesheet" href="./src/css/schedule.css" />
    <link rel="stylesheet" href="./src/css/animations.css" />
    <link rel="stylesheet" href="./src/css/category.css" />
    <link rel="stylesheet" href="./src/css/fonts.css" />
    <link rel="stylesheet" href="./src/css/footer.css" />
    <link rel="stylesheet" href="./src/css/globals.css" />

    <link rel="stylesheet" href="./src/css/ui.css" />
  </head>

  <body>
    <!-- menu -->
    <header id="header">
      <nav class="flex">
        <a href="#" class="navbar-left menu">
          <img src="src/img/logo.png" style="width: 75px" />
        </a>
      </nav>
    </header>
    <h1>Dashboard do Administrador</h1>
    <div id="userList"></div>

    <script>
      fetch("/admin/users")
        .then((response) => response.json())
        .then((users) => {
          const userList = document.getElementById("userList");
          users.forEach((user) => {
            userList.innerHTML += `<p>${user.nome} - ${user.email} - ${user.telefone}</p>`;
          });
        });
    </script>
  </body>
</html>
