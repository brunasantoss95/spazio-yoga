<!-- admin-dashboard.html -->
<div class="container mx-auto p-6">
  <header class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Painel Administrativo</h1>
    <button data-element="logoutBtn" class="px-4 py-2 bg-red-500 text-white rounded">
      Sair
    </button>
  </header>

  <div class="mb-6">
    <input 
      type="text" 
      data-element="searchInput"
      placeholder="Buscar cadastros..." 
      class="w-full px-4 py-2 border rounded"
    >
  </div>

  <div class="bg-white rounded-lg shadow overflow-hidden">
    <div class="px-4 py-3 border-b">
      <h2 class="font-semibold">
        Cadastros (<span data-element="totalUsers">0</span>)
      </h2>
    </div>
    
    <table class="w-full">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-4 py-3 text-left">Nome</th>
          <th class="px-4 py-3 text-left">Email</th>
          <th class="px-4 py-3 text-left">Telefone</th>
          <th class="px-4 py-3 text-left">Data</th>
        </tr>
      </thead>
      <tbody data-element="usersList">
        <!-- Lista de usuários será inserida aqui -->
      </tbody>
    </table>
  </div>
</div>
