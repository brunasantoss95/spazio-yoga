  <h1>Dashboard do Administrador</h1>
  <div id="userList"></div>
  
  <script>
  fetch('/admin/users')
    .then(response => response.json())
    .then(users => {
      const userList = document.getElementById('userList');
      users.forEach(user => {
        userList.innerHTML += `<p>${user.nome} - ${user.email} - ${user.telefone}</p>`;
      });
    });
  </script>
